<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모모스 시설 보수 접수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>

/* Layout: a work-order board. List of requests on top, each request opens into a three-stage record (접수 → 처리방안 → 처리결과). */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --ink: #1b1f24;
  --ink-2: #4b535d;
  --muted: #7d8590;
  --line: #d8dde3;
  --accent: #2f5597;
  --accent-soft: #e3eaf6;
  --accent-ink: #ffffff;
  --alert: #c00000;
  --alert-soft: #fbe9e9;
  --warn: #a15c00;
  --warn-soft: #fdf1df;
  --ok: #2e7d32;
  --ok-soft: #e5f3e6;
  --head: #d9e2f3;
  --font: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1d2126; --surface-2: #23282e; --ink: #e7e9ec; --ink-2: #b7bec7; --muted: #8a929c; --line: #333a42;
    --accent: #7aa2e3; --accent-soft: #23314a; --accent-ink: #0e1420; --alert: #ff7d7d; --alert-soft: #3a2124;
    --warn: #f0b35a; --warn-soft: #3a2e1c; --ok: #7bc47f; --ok-soft: #1f3322; --head: #2a3550; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1d2126; --surface-2: #23282e; --ink: #e7e9ec; --ink-2: #b7bec7; --muted: #8a929c; --line: #333a42;
  --accent: #7aa2e3; --accent-soft: #23314a; --accent-ink: #0e1420; --alert: #ff7d7d; --alert-soft: #3a2124;
  --warn: #f0b35a; --warn-soft: #3a2e1c; --ok: #7bc47f; --ok-soft: #1f3322; --head: #2a3550; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; cursor: pointer; color: inherit; }
.wrap { max-width: 920px; margin: 0 auto; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; }
.top .wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand-mark { min-width: 30px; height: 30px; padding: 0 7px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; letter-spacing: .02em; flex: none; }
.brand b { font-size: 15.5px; display: block; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 7px; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--alert); border-color: var(--alert); }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, .card:focus-visible, .chipf:focus-visible, .add-photo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.banner { margin: 12px auto 0; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: 13px; }

main { padding-block: 18px 56px; }

/* summary */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat span { color: var(--muted); font-size: 12px; display: block; }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; }
.stat.alert b { color: var(--alert); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.chipf { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chipf[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.toolbar .search { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: inherit; color: var(--ink); }
.toolbar .spacer { flex: 1 1 auto; }

/* list */
.list { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; position: relative; }
.card:hover { border-color: var(--accent); }
.card.urgent::before { content: ""; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--alert); }
.thumb64 { width: 64px; height: 52px; border-radius: 6px; background: var(--surface-2); object-fit: cover; display: block; border: 1px solid var(--line); }
.thumb64.none { display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.card-main { min-width: 0; }
.card-title { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-desc { color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { color: var(--muted); font-size: 12px; display: flex; gap: 4px 10px; flex-wrap: wrap; margin-top: 2px; }
.card-side { display: grid; justify-items: end; gap: 5px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
.tag.red { background: var(--alert-soft); color: var(--alert); }
.tag.amber { background: var(--warn-soft); color: var(--warn); }
.pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.s0 { background: var(--warn-soft); color: var(--warn); }
.pill.s1 { background: var(--accent-soft); color: var(--accent); }
.pill.s2 { background: var(--ok-soft); color: var(--ok); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 36px 20px; text-align: center; color: var(--ink-2); }
.empty b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 4px; }
.empty p { margin: 0 0 14px; }

/* detail */
.back { margin-bottom: 10px; }
.dhead { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; margin-bottom: 12px; }
.dhead-top { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.dhead h2 { margin: 0; font-size: 19px; line-height: 1.35; flex: 1 1 260px; min-width: 0; text-wrap: balance; }
.dno { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dactions { display: flex; gap: 8px; flex-wrap: wrap; }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.step { padding: 9px 12px; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line); min-width: 0; }
.step:last-child { border-right: 0; }
.step b { display: block; font-size: 13.5px; color: var(--ink-2); }
.step.done { background: var(--ok-soft); }
.step.done b { color: var(--ok); }
.step.now { background: var(--accent-soft); }
.step.now b { color: var(--accent); }

.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; overflow: hidden; }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: var(--head); }
.sec-h h3 { margin: 0; font-size: 14.5px; flex: 1 1 auto; }
.sec-h .who { color: var(--ink-2); font-size: 12px; }
.sec-b { padding: 14px 16px; }
.sec.locked .sec-b { color: var(--muted); }

dl.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); margin: 0; border-top: 1px solid var(--line); }
dl.kv dt, dl.kv dd { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
dl.kv dt { color: var(--ink-2); font-weight: 500; font-size: 13px; padding-right: 10px; }
dl.kv dd { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
dl.kv dd.na { color: var(--muted); }

.gallery { display: flex; flex-wrap: wrap; gap: 8px; }
.gallery a, .gallery .ph { display: block; width: 120px; height: 92px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* forms */
.form { display: grid; gap: 14px; }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld > label, .fld > .lab { font-weight: 700; font-size: 13px; }
.req { color: var(--alert); margin-left: 2px; }
.fld .hint { color: var(--muted); font-size: 12px; }
.in { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 8px 10px; font: inherit; }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea.in { resize: vertical; min-height: 92px; line-height: 1.55; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inline .in { flex: 1 1 160px; width: auto; }
.seg { display: inline-flex; justify-self: start; width: max-content; max-width: 100%; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 18px; font-size: 13.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.seg button[aria-pressed="true"].hot { background: var(--alert); color: #fff; }
.fld.missing .seg, .fld.missing .photos .add-photo { border-color: var(--alert); }
.fld.missing > .lab { color: var(--alert); }
.photos { display: flex; flex-wrap: wrap; gap: 8px; }
.pthumb { position: relative; width: 104px; height: 80px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pthumb button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.62); color: #fff; font-size: 12px; line-height: 22px; padding: 0; }
.add-photo { width: 104px; height: 80px; border: 1.5px dashed var(--line); border-radius: 6px; background: transparent; color: var(--muted); font-size: 12.5px; display: grid; place-content: center; justify-items: center; gap: 2px; }
.add-photo strong { font-size: 20px; font-weight: 400; line-height: 1; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.form-err { color: var(--alert); font-size: 13px; margin-right: auto; align-self: center; }
.note { color: var(--muted); font-size: 12.5px; font-style: italic; margin: 0; }

@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 transparent; border-color: var(--alert); } 50% { box-shadow: 0 0 0 4px var(--alert-soft); border-color: var(--alert); } }
.pending-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--alert); margin-right: 6px; vertical-align: 1px; animation: blink 1s ease-in-out infinite; }
.bell { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--alert); color: var(--alert); background: var(--alert-soft); font-weight: 700; padding: 6px 12px; border-radius: 999px; font-size: 13px; white-space: nowrap; animation: glow 1.4s ease-in-out infinite; }
.bell .pending-dot { margin-right: 0; }
.card.pending { border-color: var(--alert); animation: glow 1.4s ease-in-out infinite; }
.pill.s0.blink { animation: blink 1s ease-in-out infinite; background: var(--alert); color: #fff; }
.role { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.lockbox { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); }
.lockbox b { color: var(--ink); display: block; }
@keyframes glowA { 0%, 100% { box-shadow: 0 0 0 0 transparent; border-color: var(--warn); } 50% { box-shadow: 0 0 0 4px var(--warn-soft); border-color: var(--warn); } }
.pending-dot.amber { background: var(--warn); }
.bell.amber { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); animation-name: glowA; }
.bell.amber .pending-dot { background: var(--warn); }
.card.waiting { border-color: var(--warn); animation: glowA 1.4s ease-in-out infinite; }
.pill.wait { background: var(--warn); color: #fff; animation: blink 1s ease-in-out infinite; }
.pill.rej { background: var(--alert-soft); color: var(--alert); border: 1px solid var(--alert); }
.grp { display: flex; align-items: baseline; gap: 8px; margin: 12px 2px 0; font-weight: 700; color: var(--ink); }
.grp:first-child { margin-top: 0; }
.grp small { color: var(--muted); font-weight: 400; font-size: 12px; }
.approve { display: grid; gap: 10px; margin-top: 12px; }
.approve:first-child { margin-top: 0; }
.approve .row { display: flex; gap: 8px; flex-wrap: wrap; }
.who-list { display: grid; gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; }
.who-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.who-list li span { flex: 1 1 auto; min-width: 0; }
.who-list img { width: 26px; height: 26px; border-radius: 50%; }
.hits { display: grid; gap: 4px; margin-top: 6px; }
.hits button { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 10px; }
.hits img { width: 22px; height: 22px; border-radius: 50%; }
@media (prefers-reduced-motion: reduce) { .pending-dot, .bell, .card.pending, .card.waiting, .pill.s0.blink, .pill.wait { animation: none; } }
@media (max-width: 640px) { .top .wrap { flex-wrap: wrap; } .bell { order: 5; width: 100%; justify-content: center; } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); z-index: 20; }

@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { grid-template-columns: 52px minmax(0, 1fr); }
  .thumb64 { width: 52px; height: 44px; }
  .card-side { grid-column: 1 / -1; justify-items: start; grid-auto-flow: column; justify-content: start; align-items: center; }
  .tags { justify-content: flex-start; }
  .grid2 { grid-template-columns: 1fr; }
  dl.kv { grid-template-columns: 1fr; }
  dl.kv dt { border-bottom: 0; padding-bottom: 0; }
  .brand small { display: none; }
  .top .wrap { flex-wrap: nowrap; }
  .top .btn { padding: 7px 10px; }
  .long { display: none; }
  .step { padding: 8px; }
  .step span { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .card, .btn, .chipf { transition: border-color .12s, background .12s; } }

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
.who-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
#gsi-btn { min-height: 36px; display: flex; align-items: center; }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 12px; margin-bottom: 16px; }
.hero h2 { margin: 0; font-size: 19px; }
.hero p { margin: 0; color: var(--ink-2); }
.hero .row { display: flex; gap: 8px; flex-wrap: wrap; }
.section-title { font-weight: 700; margin: 6px 2px 8px; }
.doclink { font-size: 13px; color: var(--accent); }
.spin { opacity: .6; pointer-events: none; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.who-list li { flex-wrap: wrap; }
.who-list li select.in { width: auto; flex: 0 1 300px; max-width: 100%; }
@media (max-width: 640px) {
  .top .wrap { flex-wrap: wrap; row-gap: 8px; }
  .brand { flex: 1 1 100%; margin-right: 0; }
  .brand small { display: block; }
  .top .btn, .bell { padding: 6px 10px; font-size: 13px; }
  .bell { order: 0; width: auto; }
  .steps .step b { font-size: 12px; }
}
</style>
</head>
<body>
<header class="top gutter">
  <div class="wrap">
    <div class="brand"><div class="brand-mark">보수</div><div><b>모모스 시설 보수 접수</b><small>해썹생산시설 · 영도 · 온천 · 마린 · 도모헌</small></div></div>
    <span class="role" id="role" hidden>관리팀</span>
    <span class="role" id="role2" hidden>해썹 확정</span>
    <button class="btn" id="btn-refresh" type="button" hidden>새로고침</button>
    <button class="btn" id="btn-export" type="button" hidden>엑셀 다운로드</button>
    <button class="btn" id="btn-users" type="button" hidden>사용자 관리</button>
    <button class="btn primary" id="btn-new" type="button">+ 새 접수</button>
    <button class="bell amber" id="bell2" type="button" hidden></button>
    <button class="bell" id="bell" type="button" hidden></button>
    <span class="who-chip" id="who" hidden></span>
    <button class="btn ghost" id="btn-logout" type="button" hidden>로그아웃</button>
    <div id="gsi-btn"></div>
  </div>
  <div class="wrap banner" id="banner" hidden></div>
</header>

<main class="gutter"><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file-input" accept="image/*" multiple hidden>

<script src="config.js"></script>
<script src="template.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const CFG = window.APP_CONFIG || {};
const TEMPLATE_B64 = window.TEMPLATE_B64 || "";
const TEAMS = ["로스팅팀", "로스팅팀(생두소분)", "제품생산(원두)팀", "제품생산(가공_반제품)팀", "제품생산(가공_완제품)팀", "출고팀", "바리스타팀", "베이커리팀", "관리팀", "식품안전팀"];
const SITES = ["해썹생산시설", "영도매장", "온천매장", "마린매장", "도모헌매장"];
const HACCP = "해썹생산시설";
const ROOMS = [
  ["로스팅팀", ["생두소분실", "로스팅실", "사이클론실"]],
  ["출고팀", ["출고실"]],
  ["제품생산(가공)팀", ["드립백 반제품포장실", "드립백원두분쇄실", "드립백완제품포장실", "부자재실"]],
  ["제품생산(원두)팀", ["원두포장실", "원두분쇄실"]],
  ["기타", ["전실", "위생전실1", "위생전실2", "위생전실3", "휴게실"]],
];
const roomOf = (rec) => ((rec?.r?.site || HACCP) === HACCP ? rec?.r?.room || "" : "");

}

function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => res({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}
async function toJpeg(file, max = 1600, q = 0.82) {
  const { img, url } = await loadImage(file);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * s), hh = Math.round(img.naturalHeight * s);
  const c = h("canvas"); c.width = w; c.height = hh;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, hh); ctx.drawImage(img, 0, 0, w, hh);
  URL.revokeObjectURL(url);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
  return { blob, w, h: hh };
}
const blobToB64 = (b) => new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(b); });
const b64ToBlob = (s) => { const bin = atob(s); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: "image/jpeg" }); };

/* 사진 원본은 서버에서 한 건 단위로 받아 둡니다 (Word 접수서, 미리보기 대체용) */
const photoCache = {}; // driveId -> base64
const photoReq = {};
function photoData(rec) {
  if (!photoReq[rec.id]) photoReq[rec.id] = api("photos", { id: rec.id, key: keyOf(rec.id) }).then((j) => Object.assign(photoCache, j.photos)).catch(() => {});
  return photoReq[rec.id];
}
const thumbUrl = (g, w = 400) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(g)}&sz=w${w}`;
function imgFor(ref, cls, rec) {
  const img = h("img", { alt: "현장 사진", class: cls || null, loading: "lazy", referrerpolicy: "no-referrer" });
  if (ref.url) { img.src = ref.url; return img; }
  let tried = false;
  img.onerror = async () => {
    if (tried || !rec) { img.style.visibility = "hidden"; return; }
    tried = true;
    await photoData(rec);
    if (photoCache[ref.g]) img.src = "data:image/jpeg;base64," + photoCache[ref.g]; else img.style.visibility = "hidden";
  };
  img.src = thumbUrl(ref.g);
  return img;
}
async function photoBlob(ref) {
  if (!photoCache[ref.g]) throw new Error("photo");
  return b64ToBlob(photoCache[ref.g]);
}

let pickHandler = null;
$("file-input").addEventListener("change", (e) => { const f = Array.from(e.target.files || []); e.target.value = ""; pickHandler && pickHandler(f); });
function photoPicker(existing = [], rec) {
  const items = existing.map((ref) => ({ ref }));
  const box = h("div", { class: "photos" });
  function draw() {
    box.replaceChildren();
    items.forEach((it, i) => {
      const img = it.ref ? imgFor(it.ref, null, rec) : h("img", { src: it.url, alt: "새 사진" });
      box.append(h("div", { class: "pthumb" }, img, h("button", { type: "button", "aria-label": "사진 삭제", onclick: () => { items.splice(i, 1); draw(); box.dispatchEvent(new Event("change")); } }, "✕")));
    });
    if (items.length < 10) box.append(h("button", { type: "button", class: "add-photo", onclick: () => { pickHandler = add; $("file-input").click(); } }, h("strong", {}, "+"), "사진 추가"));
  }
  async function add(files) {
    let bad = 0;
    for (const f of files) {
      if (items.length >= 10) break;
      try { const p = await toJpeg(f); items.push({ ...p, url: URL.createObjectURL(p.blob) }); } catch { bad++; }
    }
    draw(); box.dispatchEvent(new Event("change"));
    if (bad) toast(`${bad}개 파일을 열 수 없습니다. JPG나 PNG 사진으로 올려 주세요.`);
  }
  box.count = () => items.length;
  box.collect = async () => ({
    keep: items.filter((it) => it.ref).map((it) => it.ref.g),
    photos: await Promise.all(items.filter((it) => !it.ref).map(async (it) => ({ b64: await blobToB64(it.blob), w: it.w, h: it.h }))),
  });
  draw();
  return box;
}

    fld("위생 담당자 재가동 확인", sign, { forId: "f-sign", req: hyg, hint: hyg ? "위생구역 접촉 건입니다. 위생 담당자가 재가동을 확인한 뒤 입력하세요." : "위생구역 접촉 건만 해당" }),
    fld("비고", memo, { forId: "f-memo" })), async () => {
      const miss = [];
      if (!doneD.value) miss.push("처리 완료일"); if (!paid.value) { miss.push("유상/무상"); fPaid.classList.add("missing"); } if (!result.value.trim()) miss.push("처리 결과"); if (hyg && !sign.value.trim()) miss.push("위생 담당자 재가동 확인");
      if (miss.length) throw new Error("필수 항목을 입력해 주세요: " + miss.join(", "));
      const ph = await photos.collect();
      const j = await api("result", { id: rec.id, data: { done: doneD.value, paid: paid.value, result: result.value.replace(/\s+$/, ""), sign: sign.value.trim(), memo: memo.value.replace(/\s+$/, "") }, photos: ph.photos, keep: ph.keep });
      records.set(rec.id, j.record);
      delete photoReq[rec.id];
      toast(j.record.status === "완료" ? "처리결과를 수정했습니다." : `처리결과를 저장했습니다. ${isHaccp(rec) ? "해썹 확정 담당자" : "관리팀"}의 수선 체크를 기다립니다.`);
      done(rec.id);
    }, () => done(rec.id), "처리결과 저장");
}

/* ---------------- Word 접수서 (원본 양식 파일을 그대로 씀) ---------------- */
/* ---------------- DOCX (the original form file is the template) ---------------- */
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function r_(text, o = {}) {
  let p = "";
  if (o.b) p += "<w:b/><w:bCs/>";
  if (o.i) p += "<w:i/><w:iCs/>";
  if (o.color) p += `<w:color w:val="${o.color}"/>`;
  if (o.sz) p += `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`;
  return `<w:r>${p ? `<w:rPr>${p}</w:rPr>` : ""}<w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;
}
const P = (runs = "", ppr = "") => `<w:p>${ppr ? `<w:pPr>${ppr}</w:pPr>` : ""}${runs}</w:p>`;
const GRAY = "888888", RED = "C00000";
const PREX = '<w:tblPrEx><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPrEx>';
const mar = (tb) => `<w:tcMar><w:top w:w="${tb}" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:bottom w:w="${tb}" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tcMar>`;
const secRow = (t) => `<w:tr>${PREX}<w:tc><w:tcPr><w:tcW w:w="9360" w:type="dxa"/><w:gridSpan w:val="2"/><w:shd w:val="clear" w:color="auto" w:fill="D9E2F3"/>${mar(80)}</w:tcPr>${P(r_(t, { b: true, sz: 21 }))}</w:tc></w:tr>`;
function row(labelLines, valueXml, center = true) {
  const va = center ? '<w:vAlign w:val="center"/>' : "";
  const lab = labelLines.map((l) => P(r_(l, { b: true }), "<w:rPr><w:b/><w:bCs/></w:rPr>")).join("");
  return `<w:tr>${PREX}<w:trPr><w:cantSplit/></w:trPr><w:tc><w:tcPr><w:tcW w:w="2200" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/>${mar(100)}${va}</w:tcPr>${lab}</w:tc>` +
    `<w:tc><w:tcPr><w:tcW w:w="7160" w:type="dxa"/>${mar(100)}${va}</w:tcPr>${valueXml || P()}</w:tc></w:tr>`;
}
const textOr = (v, ph) => v ? P(r_(v)) : (ph ? P(r_(ph, { color: GRAY })) : P());
function multiline(v, ph, minLines) {
  const sp = '<w:spacing w:after="160"/>';
  const lines = v ? v.split(/\r?\n/) : [];
  const ps = lines.map((l) => P(l ? r_(l) : "", sp));
  if (!v && ph) ps.push(P(r_(ph, { color: GRAY }), sp));
  while (ps.length < minLines) ps.push(P("", sp));
  return ps.join("");
}
function choice(opts, sel, hot, hint = "") {
  if (!sel) return P(r_(opts.join(" / "), { color: GRAY }) + hint);
  return P(opts.map((o, i) => {
    const on = o === sel;
    return r_((i ? "   " : "") + (on ? "■ " : "□ "), { color: on ? undefined : GRAY }) + r_(o, on ? { b: true, color: o === hot ? RED : undefined } : { color: GRAY });
  }).join("") + hint);
}
const EMU = 914400;
function imgRun(rid, id, cx, cy) {
  return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${id}" name="사진 ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="photo${id}.jpeg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
}
async function photosXml(refs, media, placeholder) {
  const list = [];
  for (const ref of refs || []) { try { list.push({ ref, blob: await photoBlob(ref) }); } catch {} }
  if (!list.length) return placeholder ? P(r_(placeholder, { color: GRAY })) : P();
  const perRow = list.length === 1 ? 1 : list.length === 2 ? 2 : 3;
  const maxW = [0, 4.0, 2.3, 1.5][perRow] * EMU, maxH = [0, 2.8, 1.7, 1.15][perRow] * EMU;
  const runs = list.map(({ ref, blob }) => {
    const n = media.length + 1, rid = "rIdPhoto" + n;
    media.push({ rid, name: `photo${n}.jpeg`, blob });
    const s = Math.min(maxW / (ref.w || 4), maxH / (ref.h || 3));
    return imgRun(rid, 100 + n, Math.round((ref.w || 4) * s), Math.round((ref.h || 3) * s));
  });
  let out = "";
  for (let i = 0; i < runs.length; i += perRow) out += P(runs.slice(i, i + perRow).join(r_("  ")), i + perRow < runs.length ? '<w:spacing w:after="80"/>' : "");
  return out;
}

async function buildDocx(rec) {
  await resolveNames([rec.a?.by, rec.k?.by]);
  const zip = await JSZip.loadAsync(TEMPLATE_B64, { base64: true });
  const orig = await zip.file("word/document.xml").async("string");
  const head = orig.slice(0, orig.indexOf("<w:body>") + 8);
  const sect = orig.slice(orig.lastIndexOf("<w:sectPr"), orig.lastIndexOf("</w:body>"));
  const media = [];
  const R = rec.r || {}, Pp = rec.p || {}, X = rec.x || {};
  const reporter = [R.name, R.team].filter(Boolean).join(" / ");

  let b = "";
  const siteName = siteOf(rec);
  b += P(r_(siteName === "해썹생산시설" ? "햅썹 생산시설 보수 접수서" : siteName + " 시설 보수 접수서", { b: true, sz: 36 }), '<w:spacing w:after="100"/><w:jc w:val="center"/>');
  b += P(r_("해썹생산시설 · 영도 · 온천 · 마린 · 도모헌 시설 보수 요청 양식", { color: "666666" }), '<w:spacing w:after="300"/><w:jc w:val="center"/>');
  if (rec.no) b += P(r_("접수번호 " + rec.no, { color: "666666", sz: 18 }), '<w:spacing w:after="60"/><w:jc w:val="right"/>');
  b += '<w:tbl><w:tblPr><w:tblW w:w="9360" w:type="dxa"/><w:tblBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:left w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:right w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="auto"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="auto"/></w:tblBorders><w:tblCellMar><w:left w:w="10" w:type="dxa"/><w:right w:w="10" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="0000" w:firstRow="0" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:noHBand="0" w:noVBand="0"/></w:tblPr><w:tblGrid><w:gridCol w:w="2200"/><w:gridCol w:w="7160"/></w:tblGrid>';
  b += secRow("■ 기본 정보");
  b += row(["접수일시"], textOr(fmt(R.received), "예: 2026-08-26 14:30"));
  b += row(["접수자(보고자)"], textOr(reporter, "이름 / 소속팀"));
  b += row(["사업장"], textOr(siteName));
  if (siteName === "해썹생산시설") b += row(["해썹 구역(실)"], textOr(roomOf(rec), "구역 미지정"));
  b += row(["발생 위치"], textOr(R.location, "라인명·설비명 (예: 로스팅 1호기, 포장라인 A)"));
  b += secRow("■ 보수 내용");
  b += row(["보수 내용"], multiline(R.problem, "보수가 필요한 내용과 발견 경위를 간단히 기재", 3), false);
  b += row(["발견 일시"], textOr(fmt(R.found), "실제 현장 문제를 발견한 시점"));
  b += row(["사진 첨부"], await photosXml(R.photos, media, "필수, 최소 1장 (게시글에 파일 첨부)"));
  b += secRow("■ 위생 · 안전 판단");
  b += row(["햅썹 위생구역 접촉", " 여부"], choice(["예", "아니오"], R.hygiene, "예", r_("  (제품 접촉면·배관·천장 누수 등)", { color: GRAY })));
  b += row(["가동 중단 필요 여부"], choice(["예", "아니오"], R.stop, "예"));
  b += row(["긴급도 (접수자 의견)"], choice(["긴급", "일반"], R.urgency, "긴급", r_("  ※ 최종 판단은 생산부", { color: GRAY })));
  if (isHaccp(rec)) {
    const A = rec.a;
    const when = A?.at ? dstr(A.at) : "";
    const txt = A ? [(A.ok ? "확정" : "반려"), nameOf(A.by), when].filter(Boolean).join(" · ") : "";
    b += row(["해썹 확정"], A ? P(r_(txt, A.ok ? {} : { b: true, color: RED })) : textOr("", stOf(rec) === "확정대기" ? "확정 대기" : ""));
    b += row(["확정 담당자 의견"], multiline(A?.memo || "", "", 1), false);
  }
  b += secRow("■ 처리 트래킹 (관리팀 작성란)");
  b += row(["처리 담당자 / 업체"], textOr(Pp.handler));
  b += row(["처리 예정일"], textOr(Pp.due));
  b += row(["처리 방안"], multiline(Pp.method, "", 2), false);
  b += row(["처리 상태"], choice(STATUS, docStatus(rec), ""));
  b += row(["처리 결과"], multiline([X.done ? "완료일: " + X.done + (X.paid ? " · " + X.paid : "") : "", X.result || ""].filter(Boolean).join("\n"), "", 2), false);
  b += row(["완료 사진"], await photosXml(X.photos, media));
  b += row(["위생 담당자 재가동 ", "확인"], textOr(X.sign, "위생구역 접촉 건만 해당 — 확인자 서명"));
  const K = rec.k;
  b += row(["수선 완료 체크"], K ? P(r_([K.ok ? "완료" : "재처리 요청", nameOf(K.by), K.at ? dstr(K.at) : ""].filter(Boolean).join(" · ") + (K.memo ? " — " + K.memo : ""), K.ok ? { b: true } : { b: true, color: RED }))
    : textOr("", (isHaccp(rec) ? "해썹 확정 담당자" : "관리팀") + " 확인 — 서명"));
  b += row(["비고"], multiline(X.memo, "", 2), false);
  b += "</w:tbl>";
  b += P(r_("※ 위생구역 접촉 여부와 긴급도는 필수 입력 항목입니다. 이 두 항목이 처리 우선순위와 위생 담당자 동시 통보 여부를 결정합니다.", { i: true, color: "555555", sz: 18 }), '<w:spacing w:before="300"/>');

  zip.file("word/document.xml", head + b + sect + "</w:body></w:document>");
  if (media.length) {
    const rels = await zip.file("word/_rels/document.xml.rels").async("string");
    zip.file("word/_rels/document.xml.rels", rels.replace("</Relationships>", media.map((m) => `<Relationship Id="${m.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join("") + "</Relationships>"));
    let ct = await zip.file("[Content_Types].xml").async("string");
    if (!/Extension="jpeg"/i.test(ct)) ct = ct.replace('<Default Extension="xml"', '<Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="xml"');
    zip.file("[Content_Types].xml", ct);
    media.forEach((m) => zip.file("word/media/" + m.name, m.blob));
  }
  return zip.generateAsync({ type: "blob", compression: "DEFLATE" });
}



async function buildFor(rec) {
  if ([...(rec.r?.photos || []), ...(rec.x?.photos || [])].some((p) => !photoCache[p.g])) { delete photoReq[rec.id]; await photoData(rec); }
  return buildDocx(rec);
}
const safe = (s) => (s || "").replace(/[\\/:*?"<>|]/g, "").replace(/\s+/g, " ").trim().slice(0, 30);
const docName = (rec) => `시설보수접수서_${safe(siteOf(rec))}_${rec.no || ""}${rec.r?.location ? "_" + safe(rec.r.location) : ""}.docx`;
async function downloadDocx(rec, btn) {
  btn.disabled = true; const l = btn.textContent; btn.textContent = "만드는 중…";
  try {
    const blob = await buildFor(rec);
    const a = h("a", { href: URL.createObjectURL(blob), download: docName(rec) });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast("접수서를 만들지 못했습니다. 다시 시도해 주세요."); }
  finally { btn.disabled = false; btn.textContent = l; }
}
async function saveDocToDrive(rec, btn, notify) {
  if (btn) { btn.disabled = true; btn.textContent = "저장 중…"; }
  try {
    const blob = await buildFor(rec);
    const j = await api("saveDoc", { id: rec.id, b64: await blobToB64(blob) });
    const cur = records.get(rec.id); if (cur) cur.doc = j.url;
    if (notify) toast("드라이브에 접수서를 저장했습니다.");
    if (!editing && view.name === "detail" && view.id === rec.id) render();
    return j.url;
  } catch (e) { toast("드라이브 저장에 실패했습니다: " + e.message); if (btn) { btn.disabled = false; btn.textContent = "드라이브에 접수서 저장"; } return null; }
}

render();
(async () => { if (token) await whoAmI(); else await load(); })();
